services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: osu
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: osu_playstyle
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osu -d osu_playstyle"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://osu:${DB_PASSWORD}@db/osu_playstyle
      OSU_CLIENT_ID: ${OSU_CLIENT_ID}
      OSU_CLIENT_SECRET: ${OSU_CLIENT_SECRET}
      OSU_REDIRECT_URI: ${OSU_REDIRECT_URI}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_KEY: ${ADMIN_KEY}
    ports:
      - "5000:5000"

volumes:
  pg_data:
