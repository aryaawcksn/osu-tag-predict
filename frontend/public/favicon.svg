<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#0f0e17"/>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#ff6b9d" stroke-width="3.5"/>
  <!-- Middle ring -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="#ff6b9d" stroke-width="2.5" opacity="0.6"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="5" fill="#ff6b9d"/>
  <!-- Hit cursor cross lines -->
  <line x1="32" y1="4"  x2="32" y2="14" stroke="#ff6b9d" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="32" y2="60" stroke="#ff6b9d" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="4"  y1="32" x2="14" y2="32" stroke="#ff6b9d" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="32" x2="60" y2="32" stroke="#ff6b9d" stroke-width="2.5" stroke-linecap="round"/>
</svg>
